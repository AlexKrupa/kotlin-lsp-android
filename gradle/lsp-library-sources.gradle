class LspFiles {
    // A reader never sees a partial file.
    static void writeAtomically(File target, Object content) {
        target.parentFile.mkdirs()
        def temp = File.createTempFile(target.name, '.tmp', target.parentFile)
        temp.setText(JsonOutput.prettyPrint(JsonOutput.toJson(content)), StandardCharsets.UTF_8.name())
        Files.move(temp.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE)
    }
}

// Libraries, SDKs, and Gradle APIs are maps: name to root kind to paths.
class LspRoots {
    static Map<String, Map<String, Set<String>>> empty() {
        return new TreeMap<String, Map<String, Set<String>>>()
    }

    static void addAll(Map<String, Map<String, Set<String>>> target, Map<String, Map<String, Collection<String>>> source) {
        source.each { name, roots ->
            def targetRoots = target.computeIfAbsent(name) { new TreeMap<String, Set<String>>() }
            roots.each { kind, paths -> targetRoots.computeIfAbsent(kind) { new TreeSet<String>() }.addAll(paths) }
        }
    }
}

class LspVariants {
    // The rule of the kotlin-lsp import, so that both select the same variant.
    static String select(List<String> names, String requested) {
        if (requested in names) {
            return requested
        }
        def ordered = names.sort(false) { it.contains('debug') ? 0 : 1 }
        def shortest = ordered*.length().min()
        return ordered.find { it.length() == shortest }
    }
}

abstract class LspLibrarySourcesModuleTask extends DefaultTask {
    @Internal
    List<ArtifactCollection> classpaths = []

    @Internal
    List<ArtifactCollection> sourceJars = []

    @Internal
    List<ArtifactCollection> classifierSourceJars = []

    // Gradle resolves the artifact collections for this input, so the task can be up to date.
    @InputFiles
    @PathSensitive(PathSensitivity.ABSOLUTE)
    abstract ConfigurableFileCollection getLibraryFiles()

    // Only paths, so that the merge can look for the SDK sources each time.
    @Input
    abstract MapProperty<String, Map<String, List<String>>> getSdks()

    @InputFiles
    @PathSensitive(PathSensitivity.ABSOLUTE)
    abstract ConfigurableFileCollection getFileDependencies()

    @Input
    abstract Property<String> getModulePath()

    @Input
    @Optional
    abstract ListProperty<String> getVariants()

    @Input
    @Optional
    abstract Property<String> getSelectedVariant()

    @OutputFile
    abstract RegularFileProperty getModuleFile()

    @TaskAction
    void write() {
        try {
            LspFiles.writeAtomically(moduleFile.get().asFile, [
                path      : modulePath.get(),
                variants  : variants.getOrElse([]),
                selected  : selectedVariant.getOrNull(),
                libraries : libraries(),
                sdks      : sdks.get(),
                gradleApis: gradleApis(),
            ])
        } catch (Throwable e) {
            logger.warn("kotlin-lsp-android: cannot write the libraries of ${modulePath.get()}. The old files stay.", e)
        }
    }

    Map libraries() {
        def libraries = LspRoots.empty()
        classpaths.each { classpath ->
            classpath.failures.each { logger.warn("kotlin-lsp-android: ${modulePath.get()}: ${it.message}") }
            classpath.artifacts.each { artifact ->
                def roots = libraries.computeIfAbsent(coordinate(artifact)) { [classes: new TreeSet<String>(), sources: new TreeSet<String>()] }
                roots.classes.add(artifact.file.absolutePath)
            }
        }
        def variantSources = sourcesByCoordinate(sourceJars)
        def classifierSources = sourcesByCoordinate(classifierSourceJars)
        libraries.each { coordinate, roots ->
            roots.sources.addAll(variantSources[coordinate] ?: classifierSources[coordinate] ?: [])
        }
        return libraries
    }

    Map<String, Set<String>> sourcesByCoordinate(List<ArtifactCollection> collections) {
        def sources = new TreeMap<String, Set<String>>()
        collections.each { collection ->
            // Many libraries publish no sources. This is not a problem of the build.
            collection.failures.each { logger.info("kotlin-lsp-android: ${modulePath.get()}: ${it.message}") }
            collection.artifacts.each { artifact ->
                sources.computeIfAbsent(coordinate(artifact)) { new TreeSet<String>() }.add(artifact.file.absolutePath)
            }
        }
        return sources
    }

    static String coordinate(ResolvedArtifactResult artifact) {
        def id = artifact.id.componentIdentifier as ModuleComponentIdentifier
        return "${id.group}:${id.module}:${id.version}".toString()
    }

    // The Kotlin DSL jars of the Gradle distribution have their sources in the same Gradle source
    // roots as the Gradle API, so they go into the same library.
    Map gradleApis() {
        def gradleApis = LspRoots.empty()
        fileDependencies.files.each { file ->
            def match = file.name =~ /^gradle-(?:api|kotlin-dsl|kotlin-dsl-shared-runtime|kotlin-dsl-tooling-models)-(\d.*)\.jar$/
            if (match.matches()) {
                LspRoots.addAll(gradleApis, [(match.group(1)): [classes: [file.absolutePath]]])
            }
        }
        return gradleApis
    }
}

abstract class LspLibrarySourcesTask extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.ABSOLUTE)
    abstract ConfigurableFileCollection getModuleFiles()

    @Input
    abstract Property<String> getBuildPath()

    @Internal
    abstract Property<String> getOutputDir()

    @Internal
    abstract Property<String> getGradleUserHome()

    @Internal
    abstract Property<String> getGradleHome()

    @Internal
    abstract Property<String> getGradleSources()

    @TaskAction
    void write() {
        if (!outputDir.present) {
            logger.warn('kotlin-lsp-android: KOTLIN_LSP_ANDROID_OUTPUT is not set. No files are written.')
            return
        }
        try {
            def librarySources = new File(outputDir.get(), 'library-sources')
            def fragments = new File(librarySources, 'fragments')
            def fragmentName = buildPath.get().replace(':', '_') + '.json'
            LspFiles.writeAtomically(new File(fragments, fragmentName), fragment())
            withLock(new File(fragments, '.lock')) {
                merge(new File(outputDir.get()), librarySources, fragments)
            }
        } catch (Throwable e) {
            logger.warn("kotlin-lsp-android: cannot write the library sources of ${buildPath.get()}. The old files stay.", e)
        }
    }

    Map fragment() {
        def fragment = [modules: new TreeMap<String, List<String>>(), selected: new TreeMap<String, String>(),
                        libraries: LspRoots.empty(), sdks: LspRoots.empty(), gradleApis: LspRoots.empty()]
        moduleFiles.files.findAll { it.exists() }.each { file ->
            def module = new JsonSlurper().parse(file)
            if (module.variants) {
                fragment.modules[module.path] = module.variants
            }
            if (module.selected != null) {
                fragment.selected[module.path] = module.selected
            }
            ['libraries', 'sdks', 'gradleApis'].each { LspRoots.addAll(fragment[it], module[it]) }
        }
        return fragment
    }

    // Other builds of the tree can merge in this JVM at the same time. The file lock only
    // excludes other processes, for example the separate run next to a server import.
    static void withLock(File lockFile, Closure action) {
        lockFile.parentFile.mkdirs()
        FileChannel.open(lockFile.toPath(), StandardOpenOption.CREATE, StandardOpenOption.WRITE).withCloseable { channel ->
            while (true) {
                try {
                    channel.lock()
                    break
                } catch (OverlappingFileLockException ignored) {
                    Thread.sleep(50)
                }
            }
            action()
        }
    }

    void merge(File outputDir, File librarySources, File fragments) {
        def modules = new TreeMap<String, List<String>>()
        def selected = new TreeMap<String, String>()
        def merged = [libraries: LspRoots.empty(), sdks: LspRoots.empty(), gradleApis: LspRoots.empty()]
        fragments.listFiles().findAll { it.name.endsWith('.json') }.each { file ->
            def fragment = new JsonSlurper().parse(file)
            modules.putAll(fragment.modules)
            selected.putAll(fragment.selected)
            merged.each { kind, roots -> LspRoots.addAll(roots, fragment[kind]) }
        }

        def libraries = new TreeMap<String, List<Map>>()
        def missingPlatforms = new TreeSet<String>()
        def missingGradleVersions = new TreeSet<String>()
        def javaSourcesDir = new File(librarySources, 'java-sources')
        merged.libraries.each { coordinate, roots ->
            def sources = roots.sources ?: cachedSources(coordinate)
            def group = coordinate.split(':')[0]
            def javaSources = sources.collect { javaSourcesJar(it, new File(javaSourcesDir, group)) }.findAll { it != null }
            libraries["Sources: $coordinate".toString()] = rootsOf(roots.classes, sources + javaSources)
        }
        merged.sdks.each { name, roots ->
            def sources = roots.sources.findAll { new File(it).isDirectory() }
            if (sources.isEmpty()) {
                missingPlatforms.add(name)
            }
            libraries["Sources: $name".toString()] = rootsOf(roots.classes, sources)
        }
        merged.gradleApis.each { version, roots ->
            def sources = gradleSourceRoots(version)
            if (sources == null) {
                missingGradleVersions.add(version)
            }
            libraries["Sources: gradle-api-$version".toString()] = rootsOf(roots.classes, sources ?: [])
        }

        def empty = new File(librarySources, 'empty')
        empty.mkdirs()
        LspFiles.writeAtomically(new File(librarySources, 'workspace.json'), [
            modules  : [[
                name        : 'lsp-library-sources',
                dependencies: [[type: 'moduleSource']] + libraries.keySet().collect { [type: 'library', name: it, scope: 'compile'] },
                contentRoots: [[path: empty.absolutePath]],
            ]],
            libraries: libraries.collect { name, roots -> [name: name, type: 'COMPILE', roots: roots] },
        ])
        LspFiles.writeAtomically(new File(outputDir, 'variants.json'), [modules: modules, selected: selected])
        LspFiles.writeAtomically(new File(outputDir, 'missing-sources.json'), [
            androidPlatforms: missingPlatforms,
            gradleVersions  : missingGradleVersions,
        ])
    }

    static List<Map> rootsOf(Collection<String> classes, Collection<String> sources) {
        return classes.collect { [path: it] } + sources.collect { [path: it, type: 'SOURCES'] }
    }

    // The server finds a Java file only in the folder of its package under the source root. Some
    // sources jars have all files in a top folder, for example `main/` or `jvmMain/`. A root of the
    // `json` workspace cannot be a folder in a jar, so the Java files go into a copy with no top
    // folder. Kotlin files resolve by their `package` line, so they stay only in the original jar.
    // Null means that the jar needs no copy.
    String javaSourcesJar(String sourcesJar, File targetDir) {
        try {
            def topFolder = javaTopFolder(sourcesJar)
            if (topFolder == null) {
                return null
            }
            def target = new File(targetDir, new File(sourcesJar).name)
            if (target.lastModified() < new File(sourcesJar).lastModified()) {
                copyJavaFiles(sourcesJar, topFolder, target)
            }
            return target.absolutePath
        } catch (IOException e) {
            // A bad jar must not stop the other libraries.
            logger.warn("kotlin-lsp-android: cannot read the Java files of $sourcesJar", e)
            return null
        }
    }

    // To read one entry is enough: all Java files of the known jars have the same top folder.
    static String javaTopFolder(String sourcesJar) {
        return new ZipFile(sourcesJar).withCloseable { zip ->
            // `module-info.java` has no `package` line. In `package-info.java`, annotations can
            // come before the `package` line.
            def entry = Collections.list(zip.entries()).find { it.name.endsWith('.java') && !it.name.endsWith('-info.java') }
            if (entry == null) {
                return null
            }
            def match = zip.getInputStream(entry).getText(StandardCharsets.UTF_8.name()) =~ /(?m)^\s*package\s+([\w.]+)\s*;/
            if (!match.find()) {
                return null
            }
            def folder = entry.name.substring(0, entry.name.lastIndexOf('/') + 1)
            def packageFolder = match.group(1).replace('.', '/') + '/'
            if (!folder.endsWith('/' + packageFolder)) {
                return null
            }
            return folder.substring(0, folder.length() - packageFolder.length())
        }
    }

    static void copyJavaFiles(String sourcesJar, String topFolder, File target) {
        target.parentFile.mkdirs()
        def temp = File.createTempFile(target.name, '.tmp', target.parentFile)
        new ZipFile(sourcesJar).withCloseable { zip ->
            new ZipOutputStream(temp.newOutputStream()).withCloseable { output ->
                Collections.list(zip.entries()).findAll { it.name.startsWith(topFolder) && it.name.endsWith('.java') }.each { entry ->
                    output.putNextEntry(new ZipEntry(entry.name.substring(topFolder.length())))
                    zip.getInputStream(entry).withCloseable { output << it }
                    output.closeEntry()
                }
            }
        }
        Files.move(temp.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE)
    }

    // Some libraries have no sources variant in their Gradle metadata, but other tools, for
    // example Android Studio, put their sources jar in the Gradle cache.
    List<String> cachedSources(String coordinate) {
        def (group, module, version) = coordinate.split(':')
        def versionDir = new File(gradleUserHome.get(), "caches/modules-2/files-2.1/$group/$module/$version")
        def hashDirs = versionDir.listFiles() ?: []
        return hashDirs.collectMany { it.listFiles()?.findAll { it.name.endsWith('-sources.jar') } ?: [] }*.absolutePath.sort()
    }

    // Null means that the sources are not on the disk. An `-all` distribution has them in
    // `<gradleHome>/src`. Else the download of the proxy extracts `src/main` of each Gradle
    // project to `$KOTLIN_LSP_GRADLE_SOURCES/gradle-<version>/`.
    List<String> gradleSourceRoots(String version) {
        def homeSources = gradleHome.present ? new File(gradleHome.get(), 'src') : null
        if (homeSources?.isDirectory()) {
            return distributionSourceRoots(homeSources)
        }
        def extracted = gradleSources.present ? new File(gradleSources.get(), "gradle-$version") : null
        if (extracted?.isDirectory()) {
            return extractedSourceRoots(extracted)
        }
        return null
    }

    // The rule of IntelliJ in `GradleInstallationManager`: `src` is one root, or each folder in
    // it is a root.
    static List<String> distributionSourceRoots(File homeSources) {
        if (new File(homeSources, 'org').isDirectory()) {
            return [homeSources.absolutePath]
        }
        return homeSources.listFiles().findAll { it.isDirectory() }*.absolutePath.sort()
    }

    static List<String> extractedSourceRoots(File extracted) {
        def roots = []
        Files.walkFileTree(extracted.toPath(), new SimpleFileVisitor<Path>() {
            @Override
            FileVisitResult preVisitDirectory(Path dir, BasicFileAttributes attributes) {
                if (dir.fileName.toString() != 'main' || dir.parent.fileName.toString() != 'src') {
                    return FileVisitResult.CONTINUE
                }
                ['java', 'kotlin'].collect { dir.resolve(it) }.findAll { Files.isDirectory(it) }.each { roots.add(it.toString()) }
                return FileVisitResult.SKIP_SUBTREE
            }
        })
        return roots.sort()
    }
}

void registerModuleTask(Project project, Action<LspLibrarySourcesModuleTask> configure) {
    def moduleTask = project.tasks.register('lspLibrarySourcesModule', LspLibrarySourcesModuleTask) { task ->
        try {
            task.modulePath.set(project.buildTreePath)
            task.moduleFile.set(project.layout.buildDirectory.file('lsp-library-sources/module.json'))
            configure.execute(task)
        } catch (Throwable e) {
            // The old module file stays, and the merge uses it.
            task.enabled = false
            project.logger.warn("kotlin-lsp-android: cannot read the libraries of ${project.buildTreePath}", e)
        }
    }
    project.rootProject.tasks.named('lspLibrarySources', LspLibrarySourcesTask) { task ->
        try {
            task.moduleFiles.from(moduleTask.flatMap { it.moduleFile })
        } catch (Throwable e) {
            project.logger.warn("kotlin-lsp-android: cannot add the libraries of ${project.buildTreePath}", e)
        }
    }
}

void registerAndroidModuleTask(Project project) {
    def variants = new LinkedHashMap<String, List<Configuration>>()
    def androidComponents = project.extensions.getByName('androidComponents')
    androidComponents.onVariants(androidComponents.selector().all(), { variant ->
        try {
            variants[variant.name] = [variant.compileConfiguration] + variant.nestedComponents*.compileConfiguration
        } catch (Throwable e) {
            project.logger.warn("kotlin-lsp-android: cannot read the variant ${variant.name} of ${project.buildTreePath}", e)
        }
    } as Action)
    def requested = project.providers.gradleProperty('lsp.android.variant')
        .orElse(project.providers.systemProperty('lsp.android.variant'))
        .orElse(project.providers.environmentVariable('LSP_ANDROID_VARIANT'))
    registerModuleTask(project) { task ->
        def names = variants.keySet().toList()
        def selected = LspVariants.select(names, requested.getOrNull())
        task.variants.set(names)
        task.selectedVariant.set(selected)
        variants.getOrDefault(selected, []).each { configuration ->
            def classpath = configuration.incoming.artifactView { view ->
                view.attributes { it.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar') }
                view.componentFilter { it instanceof ModuleComponentIdentifier }
                view.lenient(true)
            }.artifacts
            // The same request as `AdditionalClassifierArtifactsModelBuilder` of Android Studio.
            def sources = configuration.incoming.artifactView { view ->
                view.withVariantReselection()
                view.attributes {
                    it.attribute(Category.CATEGORY_ATTRIBUTE, project.objects.named(Category, Category.DOCUMENTATION))
                    it.attribute(DocsType.DOCS_TYPE_ATTRIBUTE, project.objects.named(DocsType, DocsType.SOURCES))
                }
                view.componentFilter { it instanceof ModuleComponentIdentifier }
                view.lenient(true)
            }.artifacts
            // Some Gradle metadata has no sources variant, but the repository has the
            // `sources` classifier jar. Android Studio uses an `ArtifactResolutionQuery` for
            // this, which a task action cannot use with the configuration cache.
            def dependencies = project.dependencies
            def classified = project.configurations.detachedConfiguration()
            classified.transitive = false
            classified.dependencies.addAllLater(classpath.resolvedArtifacts.map { artifacts ->
                artifacts.collect { LspLibrarySourcesModuleTask.coordinate(it) }.unique().collect { dependencies.create("$it:sources@jar") }
            })
            def classifierSources = classified.incoming.artifactView { it.lenient(true) }.artifacts
            task.classpaths.add(classpath)
            task.sourceJars.add(sources)
            task.classifierSourceJars.add(classifierSources)
            task.libraryFiles.from(classpath.artifactFiles, sources.artifactFiles, classifierSources.artifactFiles)
        }
        task.sdks.set(project.provider { sdkRoots(project, androidComponents) })
    }
}

// A missing SDK platform makes the AGP providers fail. The import must not fail, so the libraries
// go in with no SDK. The source folder is only a candidate here: the merge looks for it each time,
// so that a download after this task shows in the next import.
Map<String, Map<String, List<String>>> sdkRoots(Project project, androidComponents) {
    try {
        def classes = androidComponents.sdkComponents.bootClasspath.get()*.asFile
        def platform = classes.find { it.name == 'android.jar' && it.parentFile.parentFile.name == 'platforms' }
        if (platform == null) {
            return [:]
        }
        def name = platform.parentFile.name
        def sources = new File(androidComponents.sdkComponents.sdkDirectory.get().asFile, "sources/$name")
        return [(name): [classes: classes*.absolutePath, sources: [sources.absolutePath]]]
    } catch (Throwable e) {
        project.logger.warn("kotlin-lsp-android: cannot read the Android SDK of ${project.buildTreePath}", e)
        return [:]
    }
}

void registerJvmModuleTask(Project project) {
    registerModuleTask(project) { task ->
        // `gradleApi()` is a file dependency. The filter also keeps the builds of other projects out.
        def files = project.configurations.named('compileClasspath').get().incoming.artifactView { view ->
            view.componentFilter { !(it instanceof ModuleComponentIdentifier || it instanceof ProjectComponentIdentifier) }
            view.lenient(true)
        }.files
        task.fileDependencies.from(files)
    }
}

gradle.rootProject { root ->
    root.tasks.register('lspLibrarySources', LspLibrarySourcesTask) { task ->
        try {
            task.buildPath.set(root.buildTreePath)
            task.outputDir.set(root.providers.environmentVariable('KOTLIN_LSP_ANDROID_OUTPUT'))
            task.gradleUserHome.set(root.gradle.gradleUserHomeDir.absolutePath)
            task.gradleHome.set(root.gradle.gradleHomeDir?.absolutePath)
            task.gradleSources.set(root.providers.environmentVariable('KOTLIN_LSP_GRADLE_SOURCES'))
            // The separate run starts the task only in the root build. The import starts it in
            // each build.
            if (root.gradle.parent == null) {
                task.dependsOn(root.gradle.includedBuilds.collect { it.task(':lspLibrarySources') })
            }
        } catch (Throwable e) {
            task.enabled = false
            root.logger.warn("kotlin-lsp-android: cannot configure the library sources of ${root.buildTreePath}. The old files stay.", e)
        }
    }
}

gradle.allprojects { project ->
    // The server import runs no named tasks. It runs prepareKotlinIdeaImport in each project of
    // each build of the tree.
    project.tasks.named({ it == 'prepareKotlinIdeaImport' } as Spec<String>).configureEach {
        try {
            it.finalizedBy(project.rootProject.tasks.named('lspLibrarySources'))
        } catch (Throwable e) {
            project.logger.warn("kotlin-lsp-android: cannot add lspLibrarySources to the import of ${project.buildTreePath}", e)
        }
    }
    ['com.android.application', 'com.android.library'].each { pluginId ->
        project.pluginManager.withPlugin(pluginId) {
            try {
                registerAndroidModuleTask(project)
            } catch (Throwable e) {
                project.logger.warn("kotlin-lsp-android: cannot add the libraries of ${project.buildTreePath}", e)
            }
        }
    }
    // For the Gradle API of build logic projects.
    project.pluginManager.withPlugin('java') {
        try {
            registerJvmModuleTask(project)
        } catch (Throwable e) {
            project.logger.warn("kotlin-lsp-android: cannot add the Gradle API of ${project.buildTreePath}", e)
        }
    }
}
